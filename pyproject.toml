[project]
name = "shopease"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Patrick Costa", email = "pl.costa@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "asyncmy>=0.2.16",
    "asyncpg>=0.32.0",
    "authlib>=1.9.1",
    "boto3>=1.43.117",
    "email-validator>=2.3.0",
    "fastapi>=0.159.1",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "stripe>=16.0.0",
    "unicorn>=2.1.4",
]

[project.scripts]
shopease = "shopease:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
